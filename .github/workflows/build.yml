name: Build APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace > build.log 2>&1 || { grep -E "^e: |error:|What went wrong|FAILED|Could not|Execution failed|> " build.log | head -25 | while IFS= read -r l; do echo "::error::$l"; done; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: AudioToText-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
